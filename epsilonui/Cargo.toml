[package]
name = "epsilonui"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib", "staticlib"]
name = "epsilonui"

[dependencies]
uniffi = { version = "0.31.2", features = [ "cli" ] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.11", features = ["v4", "v7", "fast-rng"] }

[build-dependencies]
uniffi = { version = "0.31.2", features = [ "build" ] }